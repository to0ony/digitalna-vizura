<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <script>
      // Ručno odabrana tema prije prvog iscrtavanja, da nema bljeska
      try {
        const theme = localStorage.getItem("theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <meta
      name="description"
      content="Digitalizacija voznih redova: GTFS za Google Maps i druge aplikacije za planiranje putovanja."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Digitalna Vizura" />
    <meta property="og:title" content="Digitalizacija voznih redova · Digitalna Vizura" />
    <meta
      property="og:description"
      content="Vozni redovi javnog prijevoza pretvoreni u podatke: GTFS za Google Maps, karta uživo i vozni redovi za stanice."
    />
    <meta property="og:url" content="https://digitalnavizura.com/" />
    <meta property="og:image" content="https://digitalnavizura.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;400;600;800&family=Overpass+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <title>Digitalizacija voznih redova · Digitalna Vizura</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
